name: WebdriverIO Tests and Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-build-report:
    runs-on: ubuntu-latest
    outputs:
      test-outcome: ${{ steps.tests.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report directories
        run: mkdir -p allure-results allure-report

      - name: Run WebdriverIO and generate Allure through Docker
        id: tests
        continue-on-error: true
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests

      - name: Show Docker logs after failure
        if: steps.tests.outcome == 'failure'
        run: docker compose logs --no-color

      - name: Stop Docker containers
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload Allure report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

  deploy-report:
    if: github.event_name != 'pull_request'
    needs: test-and-build-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  quality-gate:
    if: always()
    needs: [test-and-build-report, deploy-report]
    runs-on: ubuntu-latest

    steps:
      - name: Preserve WebdriverIO test result
        shell: bash
        run: |
          if [ "${{ needs.test-and-build-report.outputs.test-outcome }}" != "success" ]; then
            echo "Dockerized WebdriverIO tests failed. Open the published Allure report for details."
            exit 1
          fi
